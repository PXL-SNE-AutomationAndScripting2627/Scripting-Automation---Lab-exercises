<!DOCTYPE html>

    <title>PowerShell Scripts</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #f6f8fb 0%, #eef4ff 100%);
      }

      .page-header {
        background: linear-gradient(135deg, #1d3557, #457b9d);
        color: #fff;
        padding: 2.5rem 0 2rem;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      .content-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }

      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 22px rgba(29, 53, 87, 0.08);
        padding: 2rem;
      }

      .script-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.9rem;
      }

      .script-list a {
        display: block;
        text-decoration: none;
        background: #f7fafd;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        color: var(--primary);
        font-weight: 600;
      }

      .script-list a:hover {
        background: #edf5ff;
      }
    </style>
